[project]
name = "mielikkix-agent-core"
version = "0.1.0"
description = "Shared LLM client, prompt/tool-calling framework, and memory/RAG utilities used by every Mielikkix Force agent and the Chat Widget."
requires-python = ">=3.12"
dependencies = [
    "groq==0.8.0",
    "pydantic-settings==2.2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mielikkix_agent_core*"]
