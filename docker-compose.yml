version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mielikkix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mielikkix}
      POSTGRES_DB: ${POSTGRES_DB:-mielikkix}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mielikkix"]
      interval: 5s
      retries: 10

  backend:
    build:
      # Repo root, not ./apps/api: apps/api/requirements.txt now has an
      # editable install of the sibling packages/agent-core (see that
      # file's comment), which Docker can only COPY if the build context
      # includes both directories -- a context scoped to ./apps/api alone
      # can't see anything outside it.
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mielikkix}:${POSTGRES_PASSWORD:-mielikkix}@db:5432/${POSTGRES_DB:-mielikkix}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/repo/apps/api
      - ./packages/agent-core:/repo/packages/agent-core
      - uploads:/repo/apps/api/uploads
      - hf_cache:/root/.cache/huggingface

  frontend:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  hf_cache:
