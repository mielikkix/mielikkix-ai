[project]
name = "mielikkix-auth"
version = "0.0.0"
description = "Shared session/auth logic, for use across apps/api, apps/dashboard's backend calls, and the Force agents."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mielikkix_auth*"]
