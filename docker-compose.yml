version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mielikkix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mielikkix}
      POSTGRES_DB: ${POSTGRES_DB:-mielikkix}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mielikkix"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mielikkix}:${POSTGRES_PASSWORD:-mielikkix}@db:5432/${POSTGRES_DB:-mielikkix}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - uploads:/app/uploads
      - hf_cache:/root/.cache/huggingface

  frontend:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  hf_cache:
